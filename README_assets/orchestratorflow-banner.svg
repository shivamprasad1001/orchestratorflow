  <text x="126" y="112" fill="#101828" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Plan</text>
  <text x="126" y="139" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="17">task intent</text>
  <text x="369" y="240" fill="#101828" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Design</text>
  <text x="369" y="267" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="17">architecture</text>
  <text x="612" y="112" fill="#101828" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Code</text>
