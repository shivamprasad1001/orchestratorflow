  <text x="82" y="330" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="800">OrchestratorFlow</text>
  <text x="665" y="330" fill="#D0D5DD" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">multi-agent software workflow automation</text>
